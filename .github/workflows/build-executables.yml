name: Build Executables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets to (e.g. v0.3.2)"
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pmon-linux-x86_64
            exe: pmon
            release_asset: pmon-linux-x86_64
            pyinstaller_extra: "--strip"
          - os: macos-latest
            artifact: pmon-macos-arm64
            exe: pmon
            release_asset: pmon-macos-arm64
            pyinstaller_extra: ""
          - os: windows-latest
            artifact: pmon-windows-x86_64
            exe: pmon.exe
            release_asset: pmon-windows-x86_64.exe
            pyinstaller_extra: ""

    steps:
      # Build the tagged source: the release tag, or the tag given to a manual run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and PyInstaller
        run: pip install -e . pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --name pmon
          --noupx
          ${{ matrix.pyinstaller_extra }}
          src/project_monitor/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}

      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          EXE: ${{ matrix.exe }}
          RELEASE_ASSET: ${{ matrix.release_asset }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          cp "dist/$EXE" "dist/$RELEASE_ASSET"
          gh release upload "$TAG" "dist/$RELEASE_ASSET" --clobber
