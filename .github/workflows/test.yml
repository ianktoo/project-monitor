name: Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "npm/**"
      - ".github/workflows/build-executables.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-npm.yml"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "npm/**"
      - ".github/workflows/build-executables.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Kept small to save CI minutes: oldest and newest Python on Linux, plus
      # Windows (which also runs tests/test_install_ps1.py under PowerShell 5.1).
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
