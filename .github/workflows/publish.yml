name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check versions match the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import json, os, re, sys, tomllib
          want = os.environ["TAG"].removeprefix("v")
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "src/project_monitor/__init__.py": re.search(
                  r'__version__ = "([^"]+)"', open("src/project_monitor/__init__.py").read()
              ).group(1),
              "npm/package.json": json.load(open("npm/package.json"))["version"],
          }
          bad = {f: v for f, v in found.items() if v != want}
          for f, v in bad.items():
              print(f"::error file={f}::version {v} does not match release tag {want}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Install package, test and build tools
        run: pip install -e ".[dev]" build

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
